[package]
name = "sub-rosa"
version = "0.3.0"
edition = "2021"
description = "sub rosa — a secret-brokering agent with a human approval gate on its own tty"
license = "MIT"

[[bin]]
name = "rosa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
nix = { version = "0.29", features = ["socket", "poll", "fs"] }
ratatui = "0.29"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
zeroize = "1"

[profile.release]
strip = true
lto = true
